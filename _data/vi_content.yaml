research:
  earlier: >
    Trước khi chuyển sang khối phổ, tôi nghiên cứu động học phản ứng chùm phân tử giao nhau và
    quang phân ly, tìm hiểu cách các liên kết bị phá vỡ và hình thành trong những va chạm đơn lẻ.
    Nền tảng hóa lý từ giai đoạn đó đến nay vẫn định hình cách nhóm tiếp cận các bài toán phân tích.
  intro: >
    Nhóm làm việc ở ranh giới giữa hóa lý cơ bản và phép đo phân tích, với khối phổ là
    sợi chỉ xuyên suốt. Nghiên cứu bắt đầu từ cơ chế hình thành ion, rồi dùng hiểu biết
    đó để phát triển những phép đo cho các bài toán mà kỹ thuật hiện có chưa giải quyết tốt.

research_themes:
  foundations:
    title: "Cơ chế ion hóa: MALDI và MAI"
    blurb: >
      Đo hiệu suất ion hóa tuyệt đối để làm rõ cách chất nền rắn sinh ra ion pha khí
      trong MALDI và MAI.
    body: >
      Có hai con đường biến chất nền rắn thành ion pha khí: MALDI, do xung laser điều
      khiển, và ion hóa có hỗ trợ chất nền (MAI), chỉ cần quá trình thăng hoa. Cả hai
      đều được nghiên cứu ở đây thông qua hiệu suất ion hóa tuyệt đối.
    problem: >
      MALDI và MAI đều sinh ion pha khí từ một chất nền rắn, loại thứ nhất nhờ xung laser,
      loại thứ hai chỉ nhờ thăng hoa. Cả hai được dùng rộng rãi cho phân tử sinh học, nhưng
      cơ chế của cả hai đều chưa ngã ngũ. Với MALDI, các mô hình ion hóa đa photon, tích tụ
      năng lượng, ion hình thành sẵn và ion hóa nhiệt cùng tồn tại trong tài liệu, và dự đoán
      của chúng mâu thuẫn nhau trong một số điều kiện. MAI còn một khó khăn nữa: chính quá
      trình chuyển pha đã tách điện tích, và phân bố trạng thái điện tích thu được lại giống
      với ion hóa phun điện, điều chưa được giải thích thỏa đáng. Hệ quả là việc chọn chất nền
      chủ yếu dựa vào kinh nghiệm, độ nhạy không thể ước lượng trước, và việc thiết kế phương
      pháp ion hóa mới thiếu cơ sở vững chắc.
    approach: >
      Đại lượng quan sát chính là hiệu suất ion hóa tuyệt đối, tức tỉ lệ giữa ion và phân tử
      trung hòa, chứ không chỉ là cường độ tín hiệu. Độ rộng xung và mật độ năng lượng laser,
      loại chất nền, cùng nhiệt độ và áp suất của cửa nạp được thay đổi một cách hệ thống, để
      mỗi mô hình cơ chế được kiểm chứng bằng chính dự đoán của nó. Với MALDI, cách làm này
      cho một mô tả định lượng dựa trên chuyển proton do nhiệt (TIPT), trong đó lượng ion sinh
      ra được quyết định bởi tính chất nhiệt động của chất nền và nhiệt độ do laser tạo ra. Với
      MAI, trọng tâm là sự tách điện tích tự phát đi kèm quá trình thăng hoa, và việc áp suất,
      nhiệt độ cùng tính chất chất nền quyết định ra sao sự hình thành ion và phân bố điện tích.
    result: >
      TIPT tái hiện được lượng ion đo trong các thí nghiệm độc lập. Với MAI, sự tách điện tích
      do thăng hoa được chứng minh là hiện tượng chung chứ không riêng cho một chất nền nào, và
      xảy ra ở cả áp suất khí quyển, dưới áp suất khí quyển lẫn trong chân không. Những kết quả
      này đã được dùng để thiết kế nguồn ion, cho ra các phương án ion hóa không cần điện thế
      cao cũng không cần laser, phù hợp với thiết bị di động. Nhìn chung, kết quả cho thấy việc
      hình thành ion từ mẫu rắn chủ yếu do nhiệt động lực học và chuyển pha chi phối.
  health:
    title: "Khối phổ carbohydrate kết hợp phân loại bằng học máy"
    blurb: >
      Cải thiện độ lặp lại trong định lượng carbohydrate bằng khối phổ và kết hợp với mô hình
      phân loại học máy để sàng lọc lâm sàng.
    body: >
      Phân tích định lượng carbohydrate bằng khối phổ từ lâu bị giới hạn bởi hiệu suất ion hóa
      và sự không đồng nhất của mẫu. Công việc ở đây xử lý độ lặp lại ngay từ khâu chuẩn bị mẫu,
      rồi đưa phổ thu được vào các mô hình phân loại phục vụ sàng lọc lâm sàng.
    problem: >
      Phân tích carbohydrate bằng khối phổ bị giới hạn bởi nhiều yếu tố: hiệu suất ion hóa thấp,
      tín hiệu bị chia nhỏ giữa các adduct kim loại kiềm, và vệt lắng hình vòng để lại khi giọt
      dung dịch khô, khiến chất phân tích phân bố không đều trên điểm mẫu. Vì vậy cường độ thay
      đổi đáng kể giữa các vị trí trên cùng một mẫu, và việc định lượng không lặp lại được. Các
      đồng phân có khối lượng gần nhau càng làm việc nhận dạng thêm khó. Những hạn chế này cộng
      lại là trở ngại chính cho việc sàng lọc nhanh từ bệnh phẩm lâm sàng như huyết thanh và nước tiểu.
    approach: >
      Phương pháp giọt đông khô nhanh (RFDD) được phát triển ở khâu chuẩn bị mẫu. Chất nền và
      chất phân tích đông đặc cùng nhau ở nhiệt độ thấp, giữ được phân bố đồng nhất của các adduct
      natri hình thành sẵn và cải thiện tính đồng đều của tín hiệu trong một điểm mẫu. Khi phép đo
      đã đáng tin cậy, toàn bộ phổ được xem như một tập đặc trưng nhiều chiều và được diễn giải bằng
      các mô hình phân loại học máy, nhờ đó bớt phụ thuộc vào cường độ của bất kỳ ion đơn lẻ nào.
    result: >
      RFDD nâng cường độ ion lên hơn hai bậc độ lớn và cải thiện tính đồng đều của tín hiệu trong
      một điểm mẫu; đường chuẩn dựng trong nền huyết thanh đạt độ tuyến tính R² = 0,99. Quy trình
      hiện đang được áp dụng cho sinh thiết lỏng từ nước tiểu, nhằm đánh giá khả năng phát hiện
      sớm ung thư và theo dõi di căn.
  sustainability:
    title: "Nhận dạng nhựa bằng khối phổ phục vụ tái chế"
    blurb: >
      Dấu vân tay khối phổ kết hợp mô hình phân loại để nhận dạng polymer hỗn hợp, cải thiện
      khâu phân loại trong tái chế nhựa.
    body: >
      Hiệu quả tái chế nhựa bị giới hạn chủ yếu ở khâu phân loại. Ở đây khối phổ được dùng như
      công cụ lấy dấu vân tay cho polymer, kết hợp với mô hình phân loại và thiết kế để dùng
      ngay tại hiện trường.
    problem: >
      Hiệu quả tái chế nhựa bị giới hạn chủ yếu ở khâu phân loại. Nếu không nhận dạng được nhanh
      và rẻ một dòng polymer hỗn hợp thì chất lượng nhựa tái chế không thể nâng lên. Phân loại
      bằng hồng ngoại gần, tiêu chuẩn hiện nay, có khả năng hạn chế với nhựa màu sẫm và vật liệu
      composite nhiều lớp — vốn chiếm phần đáng kể trong dòng rác thải thực tế.
    approach: >
      Khối phổ đóng vai trò công cụ lấy dấu vân tay cho polymer: nhiệt phân và ion hóa tạo ra một
      mẫu mảnh đặc trưng cho từng vật liệu, từ đó mô hình phân loại xác định loại polymer. Phương
      pháp được thiết kế để dùng tại hiện trường, chú trọng kích thước thiết bị, chi phí và tốc độ
      phân tích hơn là độ chính xác mức phòng thí nghiệm. Các thiết bị di động và nguồn ion mà nhóm
      phát triển trước đây là nền tảng kỹ thuật cho hướng này.
    result: >
      Công việc đang ở giai đoạn phát triển phương pháp, với kinh phí từ NSTC. Phổ tham chiếu cho
      các polymer chuẩn đang được xây dựng và các mô hình phân loại đang được kiểm chứng.
  mechanisms:
    title: "Phát hiện chất trung gian hoạt động trong xúc tác"
    blurb: >
      Hệ thống cửa nạp tùy chỉnh dùng để phát hiện các chất tồn tại ngắn ngủi trong phản ứng xúc
      tác, cung cấp bằng chứng cần thiết để phân định giữa các giả thuyết cơ chế.
    body: >
      Những chất trung gian then chốt trong chu trình xúc tác rất khó quan sát trực tiếp và thường
      chỉ được suy ra từ bằng chứng gián tiếp. Hệ thống cửa nạp tùy chỉnh cho phép đưa thẳng dung
      dịch đang phản ứng vào máy khối phổ, nhờ đó phát hiện được các chất tồn tại ngắn ngủi ngay
      trong lúc phản ứng diễn ra.
    problem: >
      Các chất trung gian then chốt trong chu trình xúc tác thường tồn tại rất ngắn và ở nồng độ
      thấp, do đó khó quan sát trực tiếp, và sự tồn tại của chúng được suy ra từ động học và tính
      toán. Khi nhiều giả thuyết cơ chế cùng giải thích tốt như nhau dữ liệu hiện có, bằng chứng
      gián tiếp không thể phân định giữa chúng, và việc thiết kế chất xúc tác vì thế bị hạn chế.
    approach: >
      Hệ thống cửa nạp tùy chỉnh đưa dung dịch đang phản ứng thẳng vào máy khối phổ. Ion hóa phun
      lạnh và cửa nạp kiểm soát nhiệt độ làm giảm sự phân hủy của các chất ngắn hạn trong quá trình
      chuyển mẫu, nhờ đó phát hiện được chúng khi phản ứng đang diễn ra. Công việc được thực hiện
      cùng các nhóm tổng hợp, điện hóa và tính toán, nhằm cung cấp bằng chứng phân định giữa những
      giả thuyết cơ chế đang cạnh tranh.
    result: >
      Trong phản ứng oxy hóa nước với phức coban hai nhân, các chất bắc cầu peroxo đã được quan sát
      và sự thay đổi trạng thái oxy hóa của phối tử không vô can được xác lập, qua đó giải thích sự
      đánh đổi giữa tốc độ phản ứng và quá thế. Trong hóa học sắt oxo hóa trị cao, các điều kiện
      phân tách cơ chế cắt liên kết O–O kiểu đồng ly và dị ly đã được làm rõ. Trong hệ tiền xúc tác
      paladi, quá trình hình thành chất hoạt động được theo dõi trực tiếp.

facility:
  tagline: "Từ kiểm nghiệm tiêu chuẩn đến phép đo theo yêu cầu"
  intro: >
    Khối phổ đã trở thành công cụ không thể thiếu trong mọi lĩnh vực hóa học, nhưng quy trình
    tiêu chuẩn lại thất bại đúng ở nơi nghiên cứu tiên phong cần nhất: quan sát các chất trung
    gian không bền, hoặc phân tử ở điều kiện khắc nghiệt. Thu được dữ liệu đó thường đòi hỏi
    thiết kế lại hệ thống cửa nạp và tích hợp một nguồn ion khác, điều mà các trung tâm thiết bị
    cố định không thể làm nếu không ảnh hưởng đến công suất và độ ổn định. Nhiều nhóm có câu hỏi
    khoa học rất tốt nhưng không có đội ngũ khối phổ đủ khả năng làm việc liên ngành cùng họ.
  positioning: >
    Nền tảng được lập ra để hợp tác nghiên cứu, không phải để kiểm nghiệm theo hợp đồng thường
    quy. Dựa trên kinh nghiệm tích hợp hệ thống khối phổ và phát triển phương pháp phân tích,
    phương án đo được hoạch định theo yêu cầu của từng đề tài.

facility_capabilities:
  "0":
    title: "Đo những mẫu khó"
    body: >
      Với các sản phẩm nhạy với không khí và hơi ẩm, cũng như những chất trung gian hoạt động
      mạnh, chúng tôi thiết kế một phương án đo khả thi để bằng chứng thực nghiệm trực tiếp
      thay cho suy luận gián tiếp.
  "1":
    title: "Quy trình thiết kế theo câu hỏi nghiên cứu"
    body: >
      Quy trình được dựng từ đặc điểm của mẫu và mục tiêu của nghiên cứu, mở rộng tới những
      điều kiện mà thiết bị tiêu chuẩn không bao phủ.
  "2":
    title: "Đào tạo kỹ thuật"
    body: >
      Ngoài phân tích và tư vấn, chúng tôi có thể sắp xếp đào tạo để nhóm hợp tác tự xây dựng
      được năng lực này.

