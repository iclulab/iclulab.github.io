facility_cases:
  "0":
    title: "Cơ chế oxy hóa nước bằng điện hóa"
    body: >
      Hợp tác với các nhóm tổng hợp và tính toán trên những phức kim loại với phối tử khác nhau,
      chúng tôi dùng khối phổ ion hóa phun lạnh để theo dõi nồng độ các chất trung gian biến đổi
      ra sao trong phản ứng. Phát hiện được chất hoạt động tồn tại ngắn ngủi giữa một phản ứng
      điện hóa diễn ra nhanh cung cấp bằng chứng ở mức phân tử để phân định giữa các giả thuyết
      cơ chế, đồng thời cho thấy thiết kế phối tử cân bằng hoạt tính với quá thế như thế nào.
  "1":
    title: "Phát triển tiền xúc tác paladi mới"
    body: >
      Tiền xúc tác SIPr-NAPA cho hoạt tính tốt trong phản ứng ghép Kumada–Tamao–Corriu. Khối phổ
      được dùng để đặc trưng hóa các tiền xúc tác mới tổng hợp, xác lập con đường hoạt hóa và sự
      hình thành chất hoạt động. Phổ cho thấy phối tử NHC và axit phosphinous tách khỏi tiền xúc
      tác, phù hợp với tính toán DFT và chỉ ra một con đường hoạt hóa chưa từng được công bố.

profile:
  bio_short: >
    I-Chung Lu là Phó Giáo sư Khoa Hóa học, Đại học Quốc lập Chung Hsing, Đài Loan. Ông nhận bằng
    cử nhân và tiến sĩ tại Đại học Quốc lập Thanh Hoa, rồi nghiên cứu sau tiến sĩ tại Viện Khoa học
    Nguyên tử và Phân tử, Academia Sinica, và tại Đại học Wayne State. Nhóm của ông phát triển các
    phương pháp khối phổ nối hóa lý cơ bản với phân tích thực tế: nghiên cứu cơ chế ion hóa MALDI,
    phân tích carbohydrate có hỗ trợ của AI phục vụ sàng lọc lâm sàng nhanh, và hệ thống cửa nạp
    tùy chỉnh để bắt các chất trung gian hoạt động trong xúc tác kim loại chuyển tiếp.
  bio_long: >
    I-Chung Lu là Phó Giáo sư tại Khoa Hóa học, Đại học Quốc lập Chung Hsing (NCHU), Đài Trung,
    Đài Loan. Ông nhận bằng cử nhân và tiến sĩ hóa học tại Đại học Quốc lập Thanh Hoa, sau đó
    nghiên cứu sau tiến sĩ tại Viện Khoa học Nguyên tử và Phân tử, Academia Sinica, và tại Đại học
    Wayne State, Hoa Kỳ. Ông bắt đầu sự nghiệp nghiên cứu độc lập tại Đại học Providence trước khi
    về NCHU.

    Nghiên cứu của ông nối hóa lý cơ bản với các ứng dụng phân tích, lấy khối phổ làm trọng tâm.
    Trên nền những nghiên cứu cơ chế ion hóa MALDI, nhóm hiện kết hợp phân tích khối phổ
    carbohydrate với mô hình phân loại dựa trên AI để phát triển công cụ chẩn đoán và sàng lọc
    nhanh. Song song, ông dùng hệ thống cửa nạp tùy chỉnh để bắt các chất trung gian hoạt động và
    những chất tồn tại ngắn ngủi, qua đó làm rõ động học và cơ chế của phản ứng xúc tác kim loại
    chuyển tiếp và phản ứng oxy hóa nước bằng điện hóa. Công việc của ông cho thấy khoa học phân
    tích tiên tiến đóng vai trò công nghệ nền, thúc đẩy các khám phá hóa học.

