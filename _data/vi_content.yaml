sections:
  independent:
    years: "2019 – nay"
    title: "Nghiên cứu độc lập"
    note: >
      Thành quả của nhóm tại Đại học Quốc lập Chung Hsing và Đại học Providence:
      định lượng carbohydrate và phân loại hỗ trợ bởi AI, khối phổ di động, cùng
      các nghiên cứu cơ chế xúc tác thực hiện với những nhóm tổng hợp và tính toán.
  ionization-techniques:
    years: "2009–2018"
    title: "Kỹ thuật ion hóa trong khối phổ"
    note: >
      Nghiên cứu sau tiến sĩ tại Viện Khoa học Nguyên tử và Phân tử, Academia Sinica,
      và tại Đại học Wayne State. Giai đoạn này xác lập cách hiểu MALDI theo hướng
      chuyển proton nhiệt và mở rộng sang ion hóa tại cửa nạp và trong chân không,
      đến nay vẫn là nền tảng cho nghiên cứu của nhóm.
  reaction-dynamics:
    years: "2003–2008"
    title: "Động học phản ứng"
    note: >
      Công việc thời nghiên cứu sinh và sau tiến sĩ giai đoạn đầu về động học phản ứng
      chùm phân tử giao nhau và quang phân ly, nghiên cứu cách các liên kết bị phá vỡ
      và hình thành trong những va chạm đơn lẻ.

