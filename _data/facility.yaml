# ============================================================
# facility.yaml — 客製化質譜探測服務平台
#
# 來源：國科會 A-Core Plus 尖端核心設施技術服務平台
#       https://www.acoreplus2024.com.tw/service/39/list
#       對應計畫 113-2740-M-002-010（A-Core Plus 子計畫主持人）
#
# 這一頁服務的對象與網站其他部分不同：是「有題目但缺質譜支援」的
# 研究團隊，而非審查委員或報考學生。因此獨立成頁，並有明確行動呼籲。
# 價格不列，因會變動，一律導向 A-Core 官網申請。
# ============================================================

apply_url: "https://www.acoreplus2024.com.tw/service/39/list"

tagline_en: "From standard testing to bespoke measurement"
tagline_zh: "從「標準檢測」到「客製服務」"

intro_en: >
  Mass spectrometry has become indispensable across the chemical sciences, but
  standardised workflows break down exactly where frontier research needs them
  most: observing unstable reaction intermediates, or molecules under extreme
  conditions. Capturing that data usually requires redesigning the inlet system
  and integrating a different ionization source, and permanent instrument
  centres cannot make those modifications without compromising throughput and
  stability. Many groups have excellent scientific questions but no mass
  spectrometry team able to work across disciplines with them.
intro_zh: >
  質譜已成為化學各領域不可或缺的工具，但當前瞻研究需要觀測不穩定的反應中間體，
  或極限條件下的分子時，標準化流程往往正好失效。這類實驗通常涉及進樣系統的
  重新設計與游離源的整合，而常設性的貴重儀器中心為維持服務量能與系統穩定，
  難以配合個別研究進行深度改裝。許多團隊有優秀的研究主題，
  但缺乏能跨領域協作的質譜支援。

positioning_en: >
  The platform is set up for research collaboration rather than routine contract
  testing. Drawing on established experience in mass spectrometry system
  integration and analytical method development, measurement schemes are planned
  around the requirements of each project.
positioning_zh: >
  本平台的定位是研究協作，而非單純的檢測委外。
  以質譜系統整合與分析方法開發的既有經驗為基礎，
  針對個別研究需求規劃合適的量測方案。

capabilities:
  - title_en: "Measurement of demanding samples"
    title_zh: "特殊樣品的量測規劃"
    body_en: >
      For air- and moisture-sensitive products and highly reactive intermediates,
      a workable measurement scheme is designed so that direct experimental
      evidence replaces indirect inference.
    body_zh: >
      針對水氧敏感的產物與高反應性中間體規劃可行的質譜探測方案，
      以直接的實驗證據取代間接推論。

  - title_en: "Workflows designed around the research question"
    title_zh: "依研究問題設計流程"
    body_en: >
      Workflows are constructed from the characteristics of the sample and the
      objective of the study, extending to conditions that standardised
      instrumentation does not cover.
    body_zh: >
      依樣品特性與研究目標設計量測流程，
      處理標準化設備難以涵蓋的實驗條件。

  - title_en: "Technical training"
    title_zh: "技術移轉與教育訓練"
    body_en: >
      In addition to analysis and consultation, training can be arranged so that
      the collaborating group develops the capability in-house.
    body_zh: >
      除檢測與諮詢外，可安排人員教育訓練，
      協助合作團隊建立自有的量測能力。

services:
  - name_en: "Observation of reaction intermediates in solution"
    name_zh: "液相反應中間體觀測"
  - name_en: "Cold-spray ionization mass spectrometry (CSI-MS)"
    name_zh: "低溫噴灑游離質譜"
  - name_en: "General mass spectrometric analysis"
    name_zh: "各式質譜檢測"
  - name_en: "Experimental design and consultation"
    name_zh: "質譜分析規劃及咨詢"

cases:
  - title_en: "Mechanism of electrochemical water oxidation"
    title_zh: "電化學水氧化反應 (WOR) 的機制"
    body_en: >
      Working with synthetic and computational groups on metal complexes with
      varied ligands, we used cold-spray ionization mass spectrometry to follow
      how intermediate concentrations evolve during the reaction. Detecting
      short-lived active species during a fast electrochemical reaction provides
      the molecular evidence required to distinguish competing mechanistic
      proposals, and indicates how ligand design balances activity against
      overpotential.
    body_zh: >
      與合成及計算團隊合作，以不同的金屬錯合物與配體組合出特性相異的催化劑。
      本平台以冷噴霧游離質譜（CSI-MS）監測反應中間體濃度隨時間的變化，
      於快速電化學反應進行中偵測壽命極短的活性中間體，
      提供區辨競爭機制假說所需的分子證據，
      並說明配位基設計如何影響活性與過電位之間的取捨。
    dois:
      - "10.1002/chem.202403583"
      - "10.1021/acscatal.5c01183"
      - "10.1021/acsorginorgau.3c00061"

  - title_en: "Development of new palladium precatalysts"
    title_zh: "新型鈀預催化劑的開發與研究"
    body_en: >
      SIPr-NAPA precatalysts show good activity in Kumada–Tamao–Corriu couplings.
      Mass spectrometry was used to characterise the newly synthesised
      precatalysts and to establish their activation pathway and the formation of
      the active species. The spectra show dissociation of the NHC and phosphinous
      acid ligands from the precatalyst, consistent with DFT calculations and
      indicating an activation route not previously reported.
    body_zh: >
      新型 SIPr-NAPA 鈀預催化劑於 Kumada–Tamao–Corriu 偶聯反應中具良好的催化活性。
      本平台以質譜鑑定新合成的預催化劑，並確認其活化途徑與活性物種的形成過程。
      質譜數據顯示 NHC 與亞膦酸配體自預催化劑解離，
      與密度泛函理論（DFT）計算結果一致，指出先前未見報導的活化途徑。
    dois:
      - "10.1002/ajoc.202500332"
      - "10.1002/cctc.202200736"
