#
# 來源：國科會 A-Core Plus 尖端核心設施技術服務平台
#       https://www.acoreplus2024.com.tw/service/39/list
#       對應計畫 113-2740-M-002-010（A-Core Plus 子計畫主持人）
#
# 這一頁服務的對象與網站其他部分不同：是「有題目但缺質譜支援」的
# 研究團隊，而非審查委員或報考學生。因此獨立成頁，並有明確行動呼籲。
