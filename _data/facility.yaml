apply_url: "https://www.acoreplus2024.com.tw/service/39/list"

tagline_en: "From standard testing to bespoke measurement"
tagline_zh: "從「標準檢測」到「客製服務」"

intro_en: >
  Mass spectrometry has become indispensable across the chemical sciences, but
  standardised workflows break down exactly where frontier research needs them
  most: observing unstable reaction intermediates, or molecules under extreme
  conditions. Capturing that data usually requires redesigning the inlet system
  and integrating a different ionization source, and permanent instrument
  centres cannot make those modifications without compromising throughput and
  stability. Many groups have excellent scientific questions but no mass
  spectrometry team able to work across disciplines with them.
intro_zh: >
  質譜已成為化學各領域不可或缺的工具，但當前瞻研究需要觀測不穩定的反應中間體，
  或極限條件下的分子時，標準化流程往往正好失效。這類實驗通常涉及進樣系統的
  重新設計與游離源的整合，而常設性的貴重儀器中心為維持服務量能與系統穩定，
  難以配合個別研究進行深度改裝。許多團隊有優秀的研究主題，
  卻苦於缺乏能跨領域協作的質譜支援。

positioning_en: >
  We are not only a data provider but a research partner. Drawing on years of
  experience in mass spectrometry system integration and analytical method
  development, this platform is built to be both flexible and precise.
positioning_zh: >
  我們不只是提供數據的檢測方，更是你的科研夥伴。
  本團隊憑藉多年累積的質譜系統整合與分析方法開發經驗，
  致力於建構兼具「彈性」與「精準度」的客製化質譜技術平台。

capabilities:
  - title_en: "Built for difficult samples"
    title_zh: "專攻特殊需求"
    body_en: >
      For air- and moisture-sensitive products and highly reactive intermediates,
      we design a workable measurement strategy and deliver direct experimental
      evidence rather than inference.
    body_zh: >
      針對水氧敏感的產物與高反應性中間體，規劃合理可行的質譜探測方案，
      提供直接的實驗證據，而不是間接推論。

  - title_en: "Measurement designed around your problem"
    title_zh: "量身打造方案"
    body_en: >
      The workflow is built from your sample characteristics and research goal
      outward, which is what makes it possible to go beyond the limits of
      standardised instrumentation.
    body_zh: >
      依據你的樣品特性與研究目標，設計專屬的質譜流程，
      突破標準化設備的限制。

  - title_en: "Training, not just service"
    title_zh: "科研人才賦能"
    body_en: >
      Alongside analysis and consultation, we can arrange training so that your
      own group builds the capability in-house.
    body_zh: >
      除了專業的質譜檢測方案與諮詢，另可專案協助人員教育訓練，
      協助貴實驗室建立核心技術與能量。

services:
  - name_en: "Observation of reaction intermediates in solution"
    name_zh: "液相反應中間體觀測"
  - name_en: "Cold-spray ionization mass spectrometry (CSI-MS)"
    name_zh: "低溫噴灑游離質譜"
  - name_en: "General mass spectrometric analysis"
    name_zh: "各式質譜檢測"
  - name_en: "Experimental design and consultation"
    name_zh: "質譜分析規劃及咨詢"

cases:
  - title_en: "Mechanism of electrochemical water oxidation"
    title_zh: "電化學水氧化反應 (WOR) 的機制"
    body_en: >
      Working with synthetic and computational groups on metal complexes with
      varied ligands, we used cold-spray ionization mass spectrometry to follow
      how intermediate concentrations evolve during the reaction. Catching
      short-lived active species while a fast electrochemical reaction is still
      running supplies the direct molecular evidence needed to distinguish
      competing mechanistic proposals, and shows how ligand design balances high
      activity against low overpotential.
    body_zh: >
      與合成及計算團隊合作，以不同的金屬錯合物與配體組合出特性相異的催化劑。
      本平台以冷噴霧游離質譜（CSI-MS）監測反應中間體濃度隨時間的變化，
      在快速的電化學反應進行中捕捉壽命極短的活性中間體，
      提供釐清複雜電催化機制所需的直接分子證據，
      並展示如何設計配位基以在高活性與低過電位之間取得平衡。
    dois:
      - "10.1002/chem.202403583"
      - "10.1021/acscatal.5c01183"
      - "10.1021/acsorginorgau.3c00061"

  - title_en: "Development of new palladium precatalysts"
    title_zh: "新型鈀預催化劑的開發與研究"
    body_en: >
      SIPr-NAPA precatalysts perform well in Kumada–Tamao–Corriu couplings. We
      used mass spectrometry both to characterise the newly synthesised
      precatalysts and to establish how they activate and form the active
      species. The spectra clearly show dissociation of the NHC and phosphinous
      acid ligands from the precatalyst, corroborating DFT calculations and
      revealing a mechanistic pathway that had not been described before.
    body_zh: >
      新型 SIPr-NAPA 鈀預催化劑在 Kumada–Tamao–Corriu 偶聯反應中表現優異。
      本平台以質譜鑑定新合成的預催化劑，並驗證其活化機制與活性物種的形成過程。
      質譜數據清楚觀察到 NHC 與亞膦酸配體從預催化劑解離的形態，
      與密度泛函理論（DFT）計算相互印證，展示了新型態的催化反應機構。
    dois:
      - "10.1002/ajoc.202500332"
      - "10.1002/cctc.202200736"
