bio_short_zh: >
  盧臆中為國立中興大學化學系副教授。國立清華大學化學系學士、博士，
  曾於中央研究院原子與分子科學研究所及美國韋恩州立大學從事博士後研究。
  研究團隊發展連結基礎物理化學與真實分析需求的質譜方法：MALDI 游離機制的機構研究、
  結合 AI 分類的醣類質譜與臨床快篩，以及能捕捉過渡金屬催化與電化學水氧化反應中間體的
  客製化質譜進樣系統。對他而言，分析科學是一種讓化學發現得以加速的使能技術。

bio_long_zh: >
  盧臆中，國立中興大學化學系副教授。國立清華大學化學系學士、博士，
  先後於中央研究院原子與分子科學研究所及美國韋恩州立大學從事博士後研究，
  並自靜宜大學應用化學系展開獨立研究生涯，其後轉任中興大學。

  他的研究以質譜為主軸，橫跨基礎物理化學與分析應用。
  在 MALDI 游離機制的研究基礎上，團隊將醣類的質譜分析與機器學習分類模型結合，
  發展診斷與快速篩檢工具；同時以客製化的質譜進樣系統捕捉反應中的瞬態物種，
  釐清過渡金屬催化與電化學水氧化的動力學與反應機構。
  這些工作共同說明了一件事：先進的分析科學本身就是一種使能技術，
  能讓化學發現走得更快。

bio_short_en: >
  I-Chung Lu is an Associate Professor of Chemistry at National Chung Hsing
  University, Taiwan. He earned his B.S. and Ph.D. from National Tsing Hua
  University and was a postdoctoral researcher at the Institute of Atomic and
  Molecular Sciences, Academia Sinica, and at Wayne State University. His group
  develops mass spectrometric methods that connect fundamental physical
  chemistry with real-world analysis: mechanistic studies of MALDI ionization,
  AI-assisted carbohydrate profiling for clinical rapid screening, and
  customized MS inlet systems that capture reactive intermediates in
  transition-metal catalysis and electrochemical water oxidation. His work
  treats analytical science as an enabling technology for chemical discovery.

bio_long_en: >
  Dr. I-Chung Lu is an Associate Professor in the Department of Chemistry,
  National Chung Hsing University (NCHU), Taichung, Taiwan. He received his B.S.
  and Ph.D. in chemistry from National Tsing Hua University, and carried out
  postdoctoral research at the Institute of Atomic and Molecular Sciences,
  Academia Sinica, and at Wayne State University, USA. He began his independent
  career at Providence University before joining NCHU.

  His research bridges fundamental physical chemistry with analytical
  applications, centred on mass spectrometry. Building on his mechanistic
  studies of MALDI ionization, his group now couples mass spectrometric analysis
  of carbohydrates with AI-based classification models to develop diagnostic and
  rapid-screening tools. In parallel, he uses customized MS inlet systems to
  capture reactive intermediates and transient species, revealing the kinetics
  and mechanisms of transition-metal-catalyzed reactions and electrochemical
  water oxidation. His work demonstrates how advanced analytical science serves
  as an enabling technology that accelerates chemical discovery.

