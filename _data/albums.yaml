# ============================================================
# albums.yaml — 實驗室生活相簿
#
# 照片檔案放在 assets/img/album/，檔名格式：{id}-{序號}.jpg
# 序號從 0 開始，build 腳本會自動掃描檔案，不必在此列出每張照片。
# 新增相簿：在最上方加一筆，把照片依 {id}-0.jpg、{id}-1.jpg… 命名丟進資料夾即可。
#
# cover：封面用第幾張（省略則用第 0 張）
# ============================================================

