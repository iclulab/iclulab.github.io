# ============================================================
# research.yaml — 研究主軸敘事
#
# 每條主軸的欄位：
#   blurb_*    首頁主題卡的一句話
#   body_*     一段式摘要（保留，供其他頁面引用）
#   problem_*  問題在哪：為什麼這件事到現在還沒解決
#   approach_* 我們的做法：方法與關鍵突破
#   result_*   目前進展
#
# 文字以學術書面語撰寫：陳述句為主，不使用設問、對仗與誇張修辭。
# 來源：RIKEN-NCHU biography + 國科會計畫方向（2026-07-26）
# 網站 Home 與 Research 頁都讀這個檔
# ============================================================

intro_en: >
  The group works at the boundary between fundamental physical chemistry and
  analytical measurement, with mass spectrometry as the common thread. The work
  begins with the mechanisms of ion formation and applies that understanding to
  the development of measurements for problems that existing techniques do not
  address well.

intro_zh: >
  本實驗室的研究橫跨基礎物理化學與分析量測，主軸為質譜。
  研究工作由離子生成機制的探討出發，並將所得認識用於發展新的量測方法，
  以處理既有技術難以觸及的分析問題。

themes:
  - id: foundations
    tag: "Foundations"
    title_en: "Ionization Mechanisms: MALDI and MAI"
    title_zh: "游離機制：MALDI 與 MAI"
    topics: [maldi, ionization-mechanism, ambient-ionization]
    blurb_zh: >
      以絕對游離效率的量測，釐清 MALDI 與 MAI 中固態基質產生氣相離子的機制。
    blurb_en: >
      Absolute ionization efficiency measurements used to establish how solid
      matrices generate gas-phase ions in MALDI and MAI.
    body_zh: >
      固態基質產生氣相離子有兩條途徑：由雷射脈衝驅動的 MALDI，
      以及僅需基質昇華即可進行的基質輔助游離（MAI）。
      本實驗室以絕對游離效率為觀測量研究兩者的離子生成過程。
    body_en: >
      Two routes convert a solid matrix into gas-phase ions: MALDI, driven by a
      laser pulse, and matrix-assisted ionization (MAI), which proceeds through
      sublimation alone. Both are studied here through absolute ionization
      efficiency.
    problem_zh: >
      基質輔助雷射脫附游離（MALDI）與基質輔助游離（MAI）皆以固態基質為媒介產生氣相離子，
      前者由雷射脈衝驅動，後者僅需基質昇華即可進行。兩者在生物分子分析中應用廣泛，
      但離子生成機制迄今仍缺乏共識。就 MALDI 而言，多光子游離、能量匯集、預形成離子
      與熱游離等模型並存於文獻，各模型的預測在部分實驗條件下互相牴觸。
      MAI 的情形另有特殊之處：相變過程本身即造成電荷分離，所得電荷態分布與電噴灑游離相近，
      其成因尚未獲得充分解釋。機制認識不足的後果是基質篩選多仰賴經驗、
      靈敏度難以事先估計，新游離方法的設計亦缺乏依據。
    problem_en: >
      Matrix-assisted laser desorption/ionization (MALDI) and matrix-assisted
      ionization (MAI) both generate gas-phase ions from a solid matrix, the former
      driven by a laser pulse and the latter by sublimation alone. Both are widely
      applied to biological molecules, yet neither mechanism is settled.
      For MALDI, multiphoton ionization, energy pooling, preformed ions and thermal
      ionization coexist in the literature, and their predictions conflict under
      certain conditions. MAI presents a further difficulty: the phase transition
      itself separates charge, and the resulting charge-state distribution resembles
      that of electrospray, which remains inadequately explained. In consequence,
      matrix selection relies largely on experience, sensitivity cannot be estimated
      in advance, and the design of new ionization methods lacks a firm basis.
    approach_zh: >
      本實驗室以絕對游離效率為主要觀測量，直接量測離子與中性物種的數量比，
      而非僅比較訊號強度。在此基礎上系統性改變雷射脈寬與能量、基質種類，
      以及進樣端的溫度與壓力條件，逐一檢驗各機制模型的預測。
      MALDI 方面據此建立熱致質子轉移（TIPT）的定量描述，
      由基質的熱力學性質與雷射誘導溫度推算離子產率。
      MAI 方面則聚焦於昇華過程中的自發電荷分離，
      釐清壓力、溫度與基質性質對離子生成與電荷態分布的影響。
    approach_en: >
      The primary observable is the absolute ionization efficiency, that is, the
      ratio of ions to neutrals, rather than signal intensity alone. Laser pulse
      width and fluence, matrix identity, and the temperature and pressure of the
      inlet are varied systematically so that each mechanistic model can be tested
      against its own predictions. For MALDI this yields a quantitative description
      based on thermally induced proton transfer (TIPT), in which the ion yield
      follows from the thermodynamic properties of the matrix and the laser-induced
      temperature. For MAI the focus is the spontaneous charge separation that
      accompanies sublimation, and how pressure, temperature and matrix properties
      determine ion formation and charge-state distribution.
    result_zh: >
      TIPT 模型在多組獨立實驗中可重現量測所得的離子產率。
      MAI 方面確認昇華驅動的電荷分離具普遍性，不限於特定基質，
      且在常壓、次常壓與真空條件下均可運作。相關認識已應用於離子源設計，
      發展出不需高電壓與雷射的游離方式，並適用於可攜式質譜儀。
      綜合結果顯示，固態樣品的離子生成主要由熱力學與相變過程決定。
    result_en: >
      TIPT reproduces measured ion yields across independent experiments.
      For MAI, sublimation-driven charge separation is found to be general rather
      than specific to one matrix, and operates at atmospheric, sub-atmospheric and
      vacuum conditions alike. These findings have been applied to ion source
      design, giving ionization schemes that require neither high voltage nor a
      laser and are compatible with portable instruments. Taken together, the
      results indicate that ion formation from solid samples is governed primarily
      by thermodynamics and phase change.

  - id: health
    tag: "Health"
    title_en: "Carbohydrate Mass Spectrometry with Machine-Learning Classification"
    title_zh: "醣類質譜與機器學習分類"
    topics: [carbohydrate, quantification, maldi]
    blurb_zh: >
      改善醣類質譜的定量重現性，並結合機器學習分類，發展臨床快速篩檢方法。
    blurb_en: >
      Improving quantitative reproducibility in carbohydrate mass spectrometry and
      coupling it to machine-learning classification for clinical screening.
    body_zh: >
      醣類的質譜定量長期受限於游離效率與樣品分布均勻性。
      本實驗室由樣品製備著手改善重現性，並將質譜資料結合分類模型，
      朝臨床快速篩檢的應用發展。
    body_en: >
      Quantitative carbohydrate analysis by mass spectrometry has long been limited
      by ionization efficiency and sample inhomogeneity. Work here addresses
      reproducibility at the sample-preparation stage and couples the resulting
      spectra to classification models for clinical screening.
    problem_zh: >
      醣類的質譜分析受限於數項因素：游離效率偏低、鹼金屬加成物使訊號分散，
      以及液滴乾燥時形成的環狀沈積使分析物在樣品點上分布不均。
      上述因素導致同一樣品於不同位置量得的訊號強度差異顯著，定量重現性不足。
      此外，醣類異構物的質量相近，僅憑質量資訊不易區分。
      這些限制構成血清、尿液等臨床檢體應用於快速篩檢的主要障礙。
    problem_en: >
      Carbohydrate analysis by mass spectrometry is limited by several factors: low
      ionization efficiency, signal division among alkali-metal adducts, and the
      ring-shaped deposit left as a droplet dries, which distributes analyte
      unevenly across the sample spot. Intensity therefore varies substantially
      between positions on the same sample, and quantification is not reproducible.
      Isomers of similar mass further complicate identification. Together these
      limitations are the principal obstacle to rapid screening from clinical
      specimens such as serum and urine.
    approach_zh: >
      本實驗室由樣品製備著手，發展快速冷凍乾燥液滴法（RFDD）。
      該方法使基質與分析物於低溫下同時固化，維持預形成鈉加成物的均勻分布，
      改善樣品點內訊號的空間一致性。在訊號可靠度提升之後，
      進一步將完整質譜視為高維特徵，結合機器學習分類模型進行判讀，
      降低判讀結果對單一離子強度的依賴。
    approach_en: >
      The rapidly freeze-drying droplet (RFDD) method was developed at the
      sample-preparation stage. Matrix and analyte solidify together at low
      temperature, preserving a homogeneous distribution of preformed sodium
      adducts and improving the spatial consistency of signal within a spot. With
      the measurement made reliable, the full spectrum is treated as a
      high-dimensional feature set and interpreted by machine-learning classifiers,
      reducing dependence on the intensity of any single ion.
    result_zh: >
      RFDD 使離子強度提升逾兩個數量級，並改善樣品點內訊號的均勻性；
      於血清基質中的定量校正線性可達 R² = 0.99。
      現階段正將此流程應用於尿液液態切片，評估其用於癌症早期偵測與轉移監測的可行性。
    result_en: >
      RFDD raises ion intensity by more than two orders of magnitude and improves
      the uniformity of signal within a sample spot; calibration in a serum matrix
      reaches a linearity of R² = 0.99. The workflow is currently being applied to
      urinary liquid biopsy, where its feasibility for early cancer detection and
      metastasis monitoring is under evaluation.

  - id: sustainability
    tag: "Sustainability"
    title_en: "Mass-Spectrometric Identification of Plastics for Recycling"
    title_zh: "塑膠的質譜辨識與回收分選"
    topics: []
    blurb_zh: >
      以質譜指紋結合分類模型辨識混合高分子，改善塑膠回收的分選環節。
    blurb_en: >
      Mass-spectrometric fingerprints combined with classification models to
      identify mixed polymers and improve the sorting stage of plastic recycling.
    body_zh: >
      塑膠回收的效率限制主要來自分選環節。
      本研究以質譜作為高分子的指紋辨識工具，結合分類模型自動判別材料種類，
      並以現場適用性為設計前提。
    body_en: >
      The efficiency of plastic recycling is limited chiefly at the sorting stage.
      Mass spectrometry is used here as a fingerprinting tool for polymers, combined
      with classification models and designed for use on site.
    problem_zh: >
      塑膠回收的效率限制主要來自分選環節。混合高分子料流若無法快速且低成本地辨識，
      再生料的品質即難以提升。現行以近紅外光譜為主的分選技術，
      對深色塑膠與多層複合材料的辨識能力有限，而此類材料在實際回收流中佔有相當比例。
    problem_en: >
      The efficiency of plastic recycling is limited chiefly at the sorting stage.
      Unless a mixed polymer stream can be identified quickly and at low cost, the
      quality of the recyclate cannot be improved. Near-infrared sorting, the
      current standard, has limited capability for dark-coloured plastics and
      multilayer composites, which constitute a substantial fraction of real waste
      streams.
    approach_zh: >
      本研究以質譜作為高分子的指紋辨識工具。不同高分子經熱裂解與游離後
      產生具特徵性的碎片組合，可作為分類依據，再以分類模型自動判別材料種類。
      方法設計以現場適用性為前提，著重量測系統的體積、成本與分析速度，
      而非實驗室級的分析精度。實驗室先前發展的可攜式質譜儀與新型離子源，
      為此提供了技術基礎。
    approach_en: >
      Mass spectrometry serves as a fingerprinting tool for polymers: pyrolysis and
      ionization yield a characteristic fragment pattern for each material, from
      which a classification model assigns the polymer type. The method is designed
      for use on site, with attention to instrument size, cost and analysis speed
      rather than laboratory-grade precision. The portable instruments and ion
      sources developed earlier in the group provide the technical basis.
    result_zh: >
      本主題目前處於方法建立階段，由國家科學及技術委員會計畫支持，
      正進行高分子標準品的質譜特徵建置與分類模型的驗證。
    result_en: >
      The work is at the method-development stage, supported by an NSTC grant.
      Reference spectra for polymer standards are being compiled and the
      classification models validated.

  - id: mechanisms
    tag: "Reaction Mechanisms"
    title_en: "Detection of Reactive Intermediates in Catalysis"
    title_zh: "催化反應中間體的直接偵測"
    topics: [catalysis, water-oxidation, electrochemistry, reactive-intermediates]
    blurb_zh: >
      以客製化進樣系統直接偵測催化反應中的瞬態物種，提供機制判別所需的實驗證據。
    blurb_en: >
      Customized inlet systems used to detect transient species during catalysis,
      providing the evidence needed to distinguish between mechanistic proposals.
    body_zh: >
      催化循環中的關鍵中間體不易直接觀測，其存在多由間接證據推論。
      本實驗室建置客製化質譜進樣系統，使反應溶液直接導入質譜儀，
      在反應進行中偵測瞬態物種。
    body_en: >
      Key intermediates in catalytic cycles are difficult to observe directly and
      are usually inferred from indirect evidence. Customized inlet systems allow
      reacting solutions to enter the mass spectrometer directly, so that transient
      species can be detected while the reaction proceeds.
    problem_zh: >
      催化循環中的關鍵中間體多具短暫壽命與低濃度，不易直接觀測，
      其存在通常由動力學數據與計算結果間接推論。
      當數個競爭性的機制假說皆能解釋既有數據時，僅憑間接證據難以判別，
      催化劑的設計方向亦因此受限。
    problem_en: >
      Key intermediates in catalytic cycles are typically short-lived and dilute,
      hence difficult to observe directly, and their existence is inferred from
      kinetics and computation. Where several competing mechanistic proposals
      account equally well for the available data, indirect evidence cannot
      discriminate between them, and catalyst design is constrained accordingly.
    approach_zh: >
      本實驗室建置客製化質譜進樣系統，使反應溶液得以直接導入質譜儀。
      低溫噴灑游離（CSI）與溫度可控的進樣設計可降低瞬態物種於傳輸過程中的分解，
      使其在反應進行中被偵測。此項工作與合成化學、電化學及計算化學團隊合作進行，
      目的在於提供可區辨競爭機制假說的實驗證據。
    approach_en: >
      Customized inlet systems introduce the reacting solution directly into the
      mass spectrometer. Cold-spray ionization and temperature-controlled inlets
      reduce decomposition of transient species during transfer, allowing them to be
      detected while the reaction proceeds. The work is carried out with synthetic,
      electrochemical and computational groups, with the aim of supplying evidence
      that discriminates between competing mechanistic proposals.
    result_zh: >
      於雙核鈷水氧化系統中觀測到過氧橋聯物種，並確認非無辜配體在催化循環中的氧化態變化，
      據以說明反應速率與過電位之間取捨關係的成因。
      於高價鐵氧物種的研究中，釐清 O–O 鍵斷裂在均裂與異裂路徑之間的分歧條件。
      於鈀預催化劑系統中，追蹤活性物種的生成過程。
    result_en: >
      In dinuclear cobalt water oxidation, peroxo-bridged species were observed and
      the change in oxidation state of a non-innocent ligand established, accounting
      for the trade-off between reaction rate and overpotential. In high-valent iron
      oxo chemistry, the conditions separating homolytic from heterolytic O–O
      cleavage were resolved. In palladium precatalyst systems, the formation of the
      active species was followed directly.

# 早期研究（僅在 Research 頁末尾以一小段帶過）
earlier_en: >
  Before turning to mass spectrometry, I worked on crossed molecular-beam
  reaction dynamics and photodissociation, studying how bonds break and form in
  isolated collisions. That training in physical chemistry still shapes how this
  group approaches analytical problems.
earlier_zh: >
  在轉向質譜之前，我的研究是交叉分子束反應動力學與光解離，
  探討化學鍵在孤立碰撞中如何斷裂與生成。
  那段物理化學的訓練，至今仍影響本團隊面對分析問題的方式。
