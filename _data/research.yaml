# ============================================================
# research.yaml — 研究主軸敘事
#
# 每條主軸的欄位：
#   blurb_*    首頁主題卡的一句話
#   body_*     一段式摘要（保留，供其他頁面引用）
#   problem_*  問題在哪：為什麼這件事到現在還沒解決
#   approach_* 我們的做法：方法與關鍵突破
#   result_*   目前成果
#   key_dois   代表著作的 DOI，研究頁會自動帶出標題、期刊與代表圖
# 來源：RIKEN-NCHU biography + 國科會計畫方向（2026-07-26）
# 網站 Home 與 Research 頁都讀這個檔
# ============================================================

intro_en: >
  My group works at the boundary between fundamental physical chemistry and
  practical analytical measurement. The through-line is mass spectrometry: we
  first ask how ions are actually formed, then use that understanding to build
  measurements that answer questions other methods cannot reach.

intro_zh: >
  本團隊的研究橫跨基礎物理化學與實用分析量測。貫穿其中的主軸是質譜：
  我們先追問離子究竟是如何生成的，再用這份理解去打造其他方法碰不到的量測能力。

themes:
  - id: foundations
    tag: "Foundations"
    title_en: "Ionization Mechanisms: MALDI and MAI"
    title_zh: "游離機制：MALDI 與 MAI"
    topics: [maldi, ionization-mechanism, ambient-ionization]
    # blurb = 首頁主題卡用的一句話；body = 一段式摘要
    blurb_en: >
      How does a solid give up gas-phase ions? We measure absolute ionization
      efficiency to show that thermodynamics and phase change, not exotic
      photochemistry, govern both MALDI and matrix-assisted ionization.
    blurb_zh: >
      固體如何交出氣相離子？我們用絕對游離效率的量測指出，
      主導 MALDI 與 MAI 的是熱力學與相變，而不是特殊的光化學。
    body_en: >
      Two routes turn a solid matrix into gas-phase ions: MALDI, driven by a laser
      pulse, and matrix-assisted ionization (MAI), which needs neither laser nor
      voltage. We study both by measuring absolute ionization efficiency, and find
      that thermodynamics and phase change, rather than exotic photochemistry,
      set what comes out.
    body_zh: >
      把固態基質變成氣相離子有兩條路：由雷射驅動的 MALDI，
      以及不需雷射也不需電壓的基質輔助游離（MAI）。
      我們以絕對游離效率的量測研究這兩者，發現決定產物的是熱力學與相變，
      而非特殊的光化學機制。
    problem_zh: >
      質譜要量到分子，前提是先讓它帶電。MALDI 用一道雷射打在基質晶體上，
      MAI 連雷射都不用，只要基質昇華就能產生高電荷態離子。兩者都已廣泛使用，
      卻有同一個難題：機制始終沒有定論。MALDI 這邊，多光子游離、能量匯集、
      預形成離子、熱游離等模型並存於文獻，各自能解釋一部分現象卻互相矛盾；
      MAI 這邊更違反直覺，一個看似單純的相變竟能造成電荷分離，
      而且電荷態分布接近電噴灑。機制不明的代價很實際：基質只能靠試誤挑選、
      靈敏度無法事先預測，新的游離方法也缺乏設計依據。
    problem_en: >
      Mass spectrometry can only weigh what it can charge. MALDI does this with a
      laser pulse on a matrix crystal; matrix-assisted ionization (MAI) needs no
      laser at all, producing multiply charged ions as the matrix simply sublimes.
      Both are in wide use, and both share the same difficulty: the mechanism has
      never been settled. For MALDI, multiphoton ionization, energy pooling,
      preformed ions and thermal ionization coexist in the literature, each
      explaining part of the picture while contradicting the others. MAI is stranger
      still, since an apparently simple phase change separates charge and yields a
      charge-state distribution close to electrospray. The cost is practical:
      matrices are chosen by trial and error, sensitivity cannot be predicted, and
      new ionization methods have little to be designed from.
    approach_zh: >
      我們不讀訊號強度，而是直接量測離子與中性分子的比例，也就是絕對游離效率，
      再系統性地改變雷射脈寬、雷射能量、基質種類與溫度壓力條件，
      逐一檢驗各模型自己的預測。MALDI 這條線由此收斂到熱致質子轉移（TIPT）：
      以基質的熱力學性質與雷射誘導溫度推算離子產率。
      MAI 這條線則把焦點放在昇華過程中的自發電荷分離，
      追蹤壓力、溫度與基質性質如何決定離子的生成與電荷態。
    approach_en: >
      Instead of reading signal intensity, we measure the ion-to-neutral ratio
      directly, that is, the absolute ionization efficiency, then vary laser pulse
      width, fluence, matrix and the temperature and pressure of the inlet to test
      each model against its own predictions. For MALDI this converges on thermally
      induced proton transfer (TIPT), where the ion yield follows from the
      thermodynamics of the matrix and the laser-induced temperature. For MAI the
      focus is the spontaneous charge separation that accompanies sublimation, and
      how pressure, temperature and matrix properties decide whether ions form and
      how highly they are charged.
    result_zh: >
      TIPT 在多組獨立實驗中重現了觀測到的離子產率。MAI 方面，
      我們確認昇華驅動的電荷分離是普遍現象而非特定基質的特例，
      並且在常壓、次常壓與真空條件下都能運作；據此發展出不需高壓電、
      不需雷射的離子源，也讓可攜式質譜的實作變得可行。
      兩條線指向同一個結論：固體交出離子這件事，主導的是熱力學與相變。
    result_en: >
      TIPT reproduces measured ion yields across independent experiments. On the MAI
      side, sublimation-driven charge separation turns out to be general rather than
      a quirk of one matrix, and it works at atmospheric, sub-atmospheric and vacuum
      conditions alike. That understanding produced ion sources requiring neither
      high voltage nor a laser, and made portable instruments practical. Both lines
      point the same way: when a solid gives up ions, thermodynamics and phase
      change are in charge.

  - id: health
    tag: "Health"
    title_en: "Carbohydrate Mass Spectrometry with AI Classification"
    title_zh: "醣類質譜結合 AI 分類"
    topics: [carbohydrate, quantification, maldi]
    blurb_en: >
      Making sugars reliably measurable by mass spectrometry, then turning those
      spectra into machine-learning models aimed at rapid clinical screening.
    blurb_zh: >
      先讓質譜測得準醣類，再把光譜接上機器學習模型，
      目標是可用於臨床快篩的判讀工具。
    body_en: >
      Carbohydrates are notoriously hard to measure by mass spectrometry: they
      ionize poorly and their isomers are nearly indistinguishable. We developed
      the rapidly freeze-drying droplet method to make MALDI quantification of
      sugars reliable, and now couple those spectra to machine-learning
      classifiers aimed at diagnostic and rapid-screening applications.
    body_zh: >
      醣類是質譜出了名難測的分子：游離效率低，異構物又幾乎無法區分。
      我們發展了快速冷凍乾燥液滴法，讓 MALDI 對醣類的定量變得可靠，
      並進一步把光譜資料接上機器學習分類模型，目標是診斷與快速篩檢應用。
    problem_zh: >
      醣類是質譜出了名難測的分子。游離效率低、鹽類加成物分散訊號、乾燥液滴留下的「咖啡環」
      讓分析物分布不均，於是同一個樣品在不同位置量到的強度可以差好幾倍，
      定量重現性差；再加上異構物幾乎同質量，連定性都不容易。
      臨床端想用血清或尿液做快篩，第一關就卡在這裡。
    problem_en: >
      Carbohydrates are notoriously difficult by mass spectrometry. They ionize
      poorly, salt adducts split the signal, and the coffee-ring left by a drying
      droplet distributes analyte so unevenly that intensity can vary several-fold
      across a single spot. Quantification is therefore unreliable, and near-isobaric
      isomers make even identification hard. Any attempt at clinical screening from
      serum or urine runs into this first.
    approach_zh: >
      我們從樣品製備下手。快速冷凍乾燥液滴法（RFDD）讓基質與分析物在低溫下同時固化，
      保留均勻分布的預形成鈉加成物，「甜蜜點」現象因此消失。
      有了可靠的訊號之後，再把整張光譜當成高維特徵，接上機器學習分類器，
      讓判讀不再依賴單一離子的強度。
    approach_en: >
      We start from sample preparation. The rapidly freeze-drying droplet (RFDD)
      method solidifies matrix and analyte together at low temperature, preserving
      homogeneously distributed preformed sodium adducts and eliminating the
      sweet-spot effect. With the signal made reliable, the full spectrum is treated
      as a high-dimensional feature set and handed to machine-learning classifiers,
      so a readout no longer rests on the intensity of one ion.
    result_zh: >
      RFDD 使離子強度提升兩個數量級以上，甜蜜點效應消失，血清中的定量線性達 R² = 0.99。
      這套流程目前正推向尿液液態切片，目標是癌症的早期偵測與轉移預警。
    result_en: >
      RFDD raises ion intensity by more than two orders of magnitude, removes the
      sweet-spot effect, and gives a calibration linearity of R² = 0.99 in serum.
      The workflow is now being pushed toward urinary liquid biopsy, aimed at early
      cancer detection and metastasis warning.
    key_dois:
      - "10.1039/D3AN02201C"
      - "10.1016/j.ijms.2025.117516"
      - "10.3390/molecules25051217"

  - id: sustainability
    tag: "Sustainability"
    title_en: "Smart Plastic Identification for Recycling"
    title_zh: "塑膠智慧辨識與回收"
    topics: []
    blurb_en: >
      Recycling fails at the sorting step. Mass-spectrometric fingerprints plus
      classification models let mixed plastic streams be identified automatically.
    blurb_zh: >
      回收的瓶頸在分選。用質譜指紋加上分類模型，
      讓混合的塑膠料流能被自動辨識。
    body_en: >
      Plastic recycling fails at the sorting step: mixed polymer streams are
      difficult to identify quickly and cheaply. We are combining mass
      spectrometric fingerprinting with machine-learning models to classify
      polymer types automatically, with the goal of making high-quality sorting
      practical at scale.
    body_zh: >
      塑膠回收的瓶頸在分選：混合的高分子料流難以快速且低成本地辨識。
      我們結合質譜指紋與機器學習模型，讓高分子種類能被自動分類，
      目標是讓高品質分選在實際規模下變得可行。
    grant_ids: ["114-2113-M-005-013-"]
    problem_zh: >
      塑膠回收的瓶頸不在化學，而在分選。混合料流若無法快速、低成本地辨識，
      後端再生料的品質就上不去。現行的近紅外分選對深色塑膠與多層複合材料幾乎失效，
      而這正是實際回收流裡佔比最高的部分。
    problem_en: >
      Plastic recycling fails at sorting, not at chemistry. If a mixed stream cannot
      be identified quickly and cheaply, the quality of the recyclate is capped.
      Near-infrared sorters, the current standard, are largely blind to dark-coloured
      plastics and multilayer composites, which is exactly what dominates real
      waste streams.
    approach_zh: >
      把質譜當成指紋工具：不同高分子在熱裂解與游離後會給出各自的碎片組合，
      再用分類模型自動判別種類。關鍵不在於做出實驗室級的精密分析，
      而在於讓量測小到可以帶到現場、快到可以跟上輸送帶。
      實驗室先前發展的可攜式質譜與新型離子源，正是這條線的基礎。
    approach_en: >
      Mass spectrometry is used here as a fingerprinting tool: each polymer gives a
      characteristic fragment pattern after pyrolysis and ionization, and a
      classification model assigns the type automatically. The point is not
      laboratory-grade precision but a measurement small enough to take to the site
      and fast enough to keep up with a conveyor. The portable instruments and ion
      sources the group built earlier are what make this plausible.
    result_zh: >
      這條線目前處於方法建立階段，由國科會 114 年度計畫支持，
      建立在實驗室已發表的可攜式質譜與新型離子源基礎上。
    result_en: >
      The line is at the method-building stage, supported by an NSTC grant and
      resting on the portable instrumentation and ion sources already published by
      the group.
    key_dois:
      - "10.1016/j.ijms.2022.116798"
      - "10.1002/rcm.8503"

  - id: mechanisms
    tag: "Reaction Mechanisms"
    title_en: "Capturing Reactive Intermediates in Catalysis"
    title_zh: "捕捉催化反應中間體"
    topics: [catalysis, water-oxidation, electrochemistry, reactive-intermediates]
    blurb_en: >
      Catalytic cycles are usually inferred, not seen. Customized inlets let us
      capture fleeting intermediates straight out of the reacting solution.
    blurb_zh: >
      催化循環通常只能被推論，而看不見。
      我們用客製化進樣系統，直接從反應中的溶液抓到一閃即逝的中間體。
    body_en: >
      Catalytic cycles are usually inferred, not observed. Using customized mass
      spectrometry inlet systems, we capture transient species directly from
      reacting solutions, which lets us pin down kinetics and mechanism in
      transition-metal catalysis and electrochemical water oxidation. This work
      is done with synthetic and computational groups: we supply the evidence
      that distinguishes competing mechanistic proposals.
    body_zh: >
      催化循環通常是被推論出來的，而不是被看見的。
      我們以客製化的質譜進樣系統，直接從反應中的溶液捕捉瞬態物種，
      藉此釐清過渡金屬催化與電化學水氧化的動力學與機構。
      這條線與合成及計算團隊合作進行，我們提供的是足以區辨競爭機構假說的關鍵證據。
    problem_zh: >
      催化循環通常是被推論出來的，而不是被看見的。中間體壽命短、濃度低，
      傳統上只能靠動力學數據與計算去回推，而錯誤的機構假設會讓催化劑設計走上冤枉路。
      要在競爭的機構假說之間做出判斷，需要的是直接證據。
    problem_en: >
      Catalytic cycles are usually inferred rather than observed. Intermediates are
      short-lived and dilute, so mechanism is normally reconstructed from kinetics
      and computation, and a wrong assumption sends catalyst design down the wrong
      path. Choosing between competing proposals calls for direct evidence.
    approach_zh: >
      我們以客製化的質譜進樣系統，把反應中的溶液直接送進質譜。
      低溫噴灑游離（CSI）與可控溫進樣讓瞬態物種在分解之前抵達偵測器，
      因此能在反應進行的當下觀察它。這條線與合成、電化學及計算團隊合作進行，
      我們提供的是足以區辨機構假說的關鍵證據。
    approach_en: >
      Customized inlet systems bring the reacting solution straight into the mass
      spectrometer. Cold-spray ionization and temperature-controlled inlets let
      transient species reach the detector before they decompose, so they can be
      watched while the reaction runs. The work is done with synthetic,
      electrochemical and computational groups: we supply the evidence that
      discriminates between mechanistic proposals.
    result_zh: >
      在雙核鈷的水氧化系統中直接觀測到過氧橋聯物種與非無辜配體的自由基態，
      說明了速率與過電位之間的取捨如何被打破；在鐵的高價氧化學中釐清 O–O 鍵
      斷裂走均裂或異裂的分歧；在鈀預催化劑中追蹤活性物種的生成過程。
    result_en: >
      In dinuclear cobalt water oxidation we observed peroxo-bridged species and the
      radical state of a non-innocent ligand directly, showing how the trade-off
      between rate and overpotential can be broken. In high-valent iron chemistry we
      resolved whether O–O cleavage proceeds homolytically or heterolytically. In
      palladium precatalysts we followed the formation of the active species itself.
    key_dois:
      - "10.1002/chem.202403583"
      - "10.1021/acs.inorgchem.5c05784"
      - "10.1021/acsorginorgau.3c00061"

# 早期研究（僅在 Research 頁末尾以一小段帶過）
earlier_en: >
  Before turning to mass spectrometry, I worked on crossed molecular-beam
  reaction dynamics and photodissociation, studying how bonds break and form in
  isolated collisions. That training in physical chemistry still shapes how this
  group approaches analytical problems.
earlier_zh: >
  在轉向質譜之前，我的研究是交叉分子束反應動力學與光解離，
  探討化學鍵在孤立碰撞中如何斷裂與生成。
  那段物理化學的訓練，至今仍影響本團隊面對分析問題的方式。
